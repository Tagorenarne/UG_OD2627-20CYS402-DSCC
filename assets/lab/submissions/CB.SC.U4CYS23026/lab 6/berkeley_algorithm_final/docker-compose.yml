services:
  cs_ba_leader:
    image: cs_ba_leader
    build: ./cs_ba_leader
    container_name: cs_ba_leader
    environment:
      CLOCK_OFFSET: "0"
    networks:
      - clock-net
    depends_on:
      - cs_ba_follower1
      - cs_ba_follower2
      - cs_ba_follower3
      - cs_ba_follower4

  cs_ba_follower1:
    image: cs_ba_follower
    build: ./cs_ba_follower
    container_name: cs_ba_follower1
    environment:
      CLIENT_ID: client1
      CLOCK_OFFSET: "-8"
    networks:
      - clock-net

  cs_ba_follower2:
    image: cs_ba_follower
    build: ./cs_ba_follower
    container_name: cs_ba_follower2
    environment:
      CLIENT_ID: client2
      CLOCK_OFFSET: "6"
    networks:
      - clock-net

  cs_ba_follower3:
    image: cs_ba_follower
    build: ./cs_ba_follower
    container_name: cs_ba_follower3
    environment:
      CLIENT_ID: client3
      CLOCK_OFFSET: "-4"
    networks:
      - clock-net

  cs_ba_follower4:
    image: cs_ba_follower
    build: ./cs_ba_follower
    container_name: cs_ba_follower4
    environment:
      CLIENT_ID: client4
      CLOCK_OFFSET: "10"
    networks:
      - clock-net

networks:
  clock-net:
    name: clock-net
    driver: bridge
