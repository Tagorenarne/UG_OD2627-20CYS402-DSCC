services:

  clock-master:
    image: akshayn789/cs_ca_leader:latest
    container_name: clock-master
    environment:
      CLOCK_OFFSET: "0"
      DELAY_MS: "0"
    networks:
      - clock-net

  clock-client1:
    image: akshayn789/cs_ca_follower:latest
    container_name: clock-client1
    environment:
      CLIENT_ID: "client1"
      CLOCK_OFFSET: "-8"
    depends_on:
      - clock-master
    networks:
      - clock-net

  clock-client2:
    image: akshayn789/cs_ca_follower:latest
    container_name: clock-client2
    environment:
      CLIENT_ID: "client2"
      CLOCK_OFFSET: "6"
    depends_on:
      - clock-master
    networks:
      - clock-net

  clock-client3:
    image: akshayn789/cs_ca_follower:latest
    container_name: clock-client3
    environment:
      CLIENT_ID: "client3"
      CLOCK_OFFSET: "-4"
    depends_on:
      - clock-master
    networks:
      - clock-net

  clock-client4:
    image: akshayn789/cs_ca_follower:latest
    container_name: clock-client4
    environment:
      CLIENT_ID: "client4"
      CLOCK_OFFSET: "10"
    depends_on:
      - clock-master
    networks:
      - clock-net

networks:
  clock-net:
    external: true