services:

  clock-master:
    build:
      context: ./master
    container_name: clock-master
    environment:
      DELAY_MS: 0
    ports:
      - "5000:5000"
    networks:
      - clock-net

  clock-client1:
    build:
      context: ./client
    container_name: clock-client1
    environment:
      CLIENT_ID: client1
      CLOCK_OFFSET: -8
      MASTER_HOST: clock-master
      MASTER_PORT: 5000
    depends_on:
      - clock-master
    networks:
      - clock-net

  clock-client2:
    build:
      context: ./client
    container_name: clock-client2
    environment:
      CLIENT_ID: client2
      CLOCK_OFFSET: 6
      MASTER_HOST: clock-master
      MASTER_PORT: 5000
    depends_on:
      - clock-master
    networks:
      - clock-net

  clock-client3:
    build:
      context: ./client
    container_name: clock-client3
    environment:
      CLIENT_ID: client3
      CLOCK_OFFSET: -4
      MASTER_HOST: clock-master
      MASTER_PORT: 5000
    depends_on:
      - clock-master
    networks:
      - clock-net

  clock-client4:
    build:
      context: ./client
    container_name: clock-client4
    environment:
      CLIENT_ID: client4
      CLOCK_OFFSET: 10
      MASTER_HOST: clock-master
      MASTER_PORT: 5000
    depends_on:
      - clock-master
    networks:
      - clock-net


networks:

  clock-net:
    name: clock-net
    driver: bridge