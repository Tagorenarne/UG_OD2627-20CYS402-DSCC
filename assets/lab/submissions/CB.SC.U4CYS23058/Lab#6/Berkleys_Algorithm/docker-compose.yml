services:

  berkeley-master:
    build:
      context: ./master

    container_name: berkeley-master

    environment:
      MASTER_PORT: 5000
      CLOCK_OFFSET: 0

    networks:
      - berkeley-net


  berkeley-client1:
    build:
      context: ./client

    container_name: berkeley-client1

    environment:
      MASTER_HOST: berkeley-master
      MASTER_PORT: 5000
      CLIENT_ID: client1
      CLOCK_OFFSET: -8

    depends_on:
      - berkeley-master

    networks:
      - berkeley-net


  berkeley-client2:
    build:
      context: ./client

    container_name: berkeley-client2

    environment:
      MASTER_HOST: berkeley-master
      MASTER_PORT: 5000
      CLIENT_ID: client2
      CLOCK_OFFSET: 6

    depends_on:
      - berkeley-master

    networks:
      - berkeley-net


  berkeley-client3:
    build:
      context: ./client

    container_name: berkeley-client3

    environment:
      MASTER_HOST: berkeley-master
      MASTER_PORT: 5000
      CLIENT_ID: client3
      CLOCK_OFFSET: -4

    depends_on:
      - berkeley-master

    networks:
      - berkeley-net


  berkeley-client4:
    build:
      context: ./client

    container_name: berkeley-client4

    environment:
      MASTER_HOST: berkeley-master
      MASTER_PORT: 5000
      CLIENT_ID: client4
      CLOCK_OFFSET: 10

    depends_on:
      - berkeley-master

    networks:
      - berkeley-net


networks:

  berkeley-net:
    driver: bridge