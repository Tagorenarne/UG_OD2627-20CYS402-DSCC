services:

  clock-master:
    build: ./master
    container_name: clock-master
    environment:
      CLOCK_OFFSET: "0"
    networks:
      - clock-net

  clock-client1:
    build: ./client
    container_name: clock-client1
    environment:
      CLOCK_OFFSET: "-8"
      PORT: "5001"
    networks:
      - clock-net

  clock-client2:
    build: ./client
    container_name: clock-client2
    environment:
      CLOCK_OFFSET: "6"
      PORT: "5002"
    networks:
      - clock-net

  clock-client3:
    build: ./client
    container_name: clock-client3
    environment:
      CLOCK_OFFSET: "-4"
      PORT: "5003"
    networks:
      - clock-net

  clock-client4:
    build: ./client
    container_name: clock-client4
    environment:
      CLOCK_OFFSET: "10"
      PORT: "5004"
    networks:
      - clock-net

networks:

  clock-net:
    driver: bridge