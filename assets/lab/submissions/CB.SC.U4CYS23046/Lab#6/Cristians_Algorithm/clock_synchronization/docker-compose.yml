services:

  clock-master:
    build: ./master
    container_name: clock-master
    environment:
      SERVER_DELAY: "0"
    ports:
      - "5000:5000"
    networks:
      - clock-net

  clock-client1:
    build: ./client
    container_name: clock-client1
    environment:
      CLIENT_ID: "Client-1"
      CLOCK_OFFSET: "-8"
    depends_on:
      - clock-master
    networks:
      - clock-net

  clock-client2:
    build: ./client
    container_name: clock-client2
    environment:
      CLIENT_ID: "Client-2"
      CLOCK_OFFSET: "6"
    depends_on:
      clock-client1:
        condition: service_completed_successfully
    networks:
      - clock-net

  clock-client3:
    build: ./client
    container_name: clock-client3
    environment:
      CLIENT_ID: "Client-3"
      CLOCK_OFFSET: "-4"
    depends_on:
      clock-client2:
        condition: service_completed_successfully
    networks:
      - clock-net

  clock-client4:
    build: ./client
    container_name: clock-client4
    environment:
      CLIENT_ID: "Client-4"
      CLOCK_OFFSET: "10"
    depends_on:
      clock-client3:
        condition: service_completed_successfully
    networks:
      - clock-net

networks:
  clock-net:
    name: clock-net
    driver: bridge