services:
  master:
    build: ./master
    container_name: master
    networks:
      - clock-net
    environment:
      MASTER_PORT: "5000"
      MASTER_OFFSET: "0"
      ARTIFICIAL_DELAY_MS: "0"

  client1:
    build: ./client
    container_name: client1
    depends_on:
      - master
    networks:
      - clock-net
    environment:
      CLIENT_ID: Client-1
      CLOCK_OFFSET: "-8"
      MASTER_HOST: master
      MASTER_PORT: "5000"
      SYNC_INTERVAL: "10"

  client2:
    build: ./client
    container_name: client2
    depends_on:
      - master
    networks:
      - clock-net
    environment:
      CLIENT_ID: Client-2
      CLOCK_OFFSET: "6"
      MASTER_HOST: master
      MASTER_PORT: "5000"
      SYNC_INTERVAL: "10"

  client3:
    build: ./client
    container_name: client3
    depends_on:
      - master
    networks:
      - clock-net
    environment:
      CLIENT_ID: Client-3
      CLOCK_OFFSET: "-4"
      MASTER_HOST: master
      MASTER_PORT: "5000"
      SYNC_INTERVAL: "10"

  client4:
    build: ./client
    container_name: client4
    depends_on:
      - master
    networks:
      - clock-net
    environment:
      CLIENT_ID: Client-4
      CLOCK_OFFSET: "10"
      MASTER_HOST: master
      MASTER_PORT: "5000"
      SYNC_INTERVAL: "10"

networks:
  clock-net:
    driver: bridge