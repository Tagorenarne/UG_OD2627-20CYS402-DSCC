services:
  master:
    build: ./master
    container_name: master
    environment:
      - CLOCK_OFFSET=0
      - CLIENTS=client1:6000,client2:6000,client3:6000,client4:6000
      - POLL_DELAY=3
      - OUTLIER_FILTER=false
      - OUTLIER_THRESHOLD=15
    depends_on:
      - client1
      - client2
      - client3
      - client4
    networks:
      - clock-net

  client1:
    build: ./client
    container_name: client1
    environment:
      - CLIENT_ID=Client 1
      - CLOCK_OFFSET=-8
      - PORT=6000
    networks:
      - clock-net

  client2:
    build: ./client
    container_name: client2
    environment:
      - CLIENT_ID=Client 2
      - CLOCK_OFFSET=6
      - PORT=6000
    networks:
      - clock-net

  client3:
    build: ./client
    container_name: client3
    environment:
      - CLIENT_ID=Client 3
      - CLOCK_OFFSET=-4
      - PORT=6000
    networks:
      - clock-net

  client4:
    build: ./client
    container_name: client4
    environment:
      - CLIENT_ID=Client 4
      - CLOCK_OFFSET=10
      - PORT=6000
    networks:
      - clock-net

networks:
  clock-net:
    name: clock-net
    driver: bridge
