services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: midterm_db
      MYSQL_USER: midterm_user
      MYSQL_PASSWORD: midterm_pass
    volumes:
      - ./database/database.sql:/docker-entrypoint-initdb.d/database.sql

  web:
    build: .
    image: mt-webauth
    depends_on:
      - db
    ports:
      - "8080:8000"
    volumes:
      - ./web:/midterm-exam
