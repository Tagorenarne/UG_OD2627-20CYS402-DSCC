services:
  berkeley-master:
    build: ./master
    container_name: berkeley-master
    networks:
      - berkeley-net
    environment:
      - NUM_CLIENTS=4

  client1:
    build: ./client
    container_name: berkeley-client1
    depends_on:
      - berkeley-master
    networks:
      - berkeley-net
    environment:
      - CLIENT_ID=Client-1
      - CLOCK_OFFSET=-8

  client2:
    build: ./client
    container_name: berkeley-client2
    depends_on:
      - berkeley-master
    networks:
      - berkeley-net
    environment:
      - CLIENT_ID=Client-2
      - CLOCK_OFFSET=6

  client3:
    build: ./client
    container_name: berkeley-client3
    depends_on:
      - berkeley-master
    networks:
      - berkeley-net
    environment:
      - CLIENT_ID=Client-3
      - CLOCK_OFFSET=-4

  client4:
    build: ./client
    container_name: berkeley-client4
    depends_on:
      - berkeley-master
    networks:
      - berkeley-net
    environment:
      - CLIENT_ID=Client-4
      - CLOCK_OFFSET=10

networks:
  berkeley-net:
    driver: bridge
    name: berkeley-net
