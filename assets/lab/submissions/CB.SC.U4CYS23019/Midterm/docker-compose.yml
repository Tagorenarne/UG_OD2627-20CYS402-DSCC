version: "3.8"

services:

  db:
    image: mysql:8

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: midterm_db
      MYSQL_USER: midterm_user
      MYSQL_PASSWORD: midterm_pass

    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  web:

    build: .

    ports:
      - "5001:5000"

    volumes:
      - ./web:/midterm-exam/web

    depends_on:
      - db
