services:

  clock-master:
    build: ./master
    container_name: clock-master
    environment:
      - ARTIFICIAL_DELAY=0.2
    networks:
      - clock-net

  client1:
    build: ./client
    container_name: clock-client1
    depends_on:
      - clock-master
    environment:
      - CLIENT_ID=Client-1
      - CLOCK_OFFSET=-8
    networks:
      - clock-net

  client2:
    build: ./client
    container_name: clock-client2
    depends_on:
      - clock-master
    environment:
      - CLIENT_ID=Client-2
      - CLOCK_OFFSET=6
    networks:
      - clock-net

  client3:
    build: ./client
    container_name: clock-client3
    depends_on:
      - clock-master
    environment:
      - CLIENT_ID=Client-3
      - CLOCK_OFFSET=-4
    networks:
      - clock-net

  client4:
    build: ./client
    container_name: clock-client4
    depends_on:
      - clock-master
    environment:
      - CLIENT_ID=Client-4
      - CLOCK_OFFSET=10
    networks:
      - clock-net

networks:
  clock-net:
    external: true
