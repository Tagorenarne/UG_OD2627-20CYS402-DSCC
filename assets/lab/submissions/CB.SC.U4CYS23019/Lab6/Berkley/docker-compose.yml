services:

  berkeley-slave1:
    build: ./slave
    image: jaiaditya29/berkeley_algorithm:slave
    container_name: berkeley-slave1
    environment:
      - SLAVE_ID=Slave-1
      - CLOCK_OFFSET=-8
      - PORT=6000
    networks:
      - berkeley-net

  berkeley-slave2:
    build: ./slave
    image: jaiaditya29/berkeley_algorithm:slave
    container_name: berkeley-slave2
    environment:
      - SLAVE_ID=Slave-2
      - CLOCK_OFFSET=6
      - PORT=6000
    networks:
      - berkeley-net

  berkeley-slave3:
    build: ./slave
    image: jaiaditya29/berkeley_algorithm:slave
    container_name: berkeley-slave3
    environment:
      - SLAVE_ID=Slave-3
      - CLOCK_OFFSET=-4
      - PORT=6000
    networks:
      - berkeley-net

  berkeley-slave4:
    build: ./slave
    image: jaiaditya29/berkeley_algorithm:slave
    container_name: berkeley-slave4
    environment:
      - SLAVE_ID=Slave-4
      - CLOCK_OFFSET=10
      - PORT=6000
    networks:
      - berkeley-net

  berkeley-master:
    build: ./master
    image: jaiaditya29/berkeley_algorithm:master
    container_name: berkeley-master
    depends_on:
      - berkeley-slave1
      - berkeley-slave2
      - berkeley-slave3
      - berkeley-slave4
    environment:
      - MASTER_ID=Master
      - CLOCK_OFFSET=0
      - ARTIFICIAL_DELAY=0.05
      - SLAVES=berkeley-slave1:6000,berkeley-slave2:6000,berkeley-slave3:6000,berkeley-slave4:6000
    networks:
      - berkeley-net

networks:
  berkeley-net:
    driver: bridge
