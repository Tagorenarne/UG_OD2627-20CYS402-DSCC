# Lab 6A - Cristian's Clock Synchronization
# Create the network once first:  docker network create clock-net

x-client-base: &client-base
  build: ./client
  depends_on:
    - master
  networks:
    - clock-net
  volumes:
    - ./results:/results

x-client-env: &client-env
  MASTER_HOST: clock-master
  MASTER_PORT: "5000"
  MASTER_OFFSET: "0"
  SYNC_ROUNDS: "${SYNC_ROUNDS:-1}"
  SYNC_INTERVAL: "${SYNC_INTERVAL:-5}"
  EXPERIMENT: "${EXPERIMENT:-1}"
  MASTER_DELAY_MS: "${MASTER_DELAY_MS:-0}"
  DELAY_MODE: "${DELAY_MODE:-symmetric}"
  RESULTS_DIR: /results

services:
  master:
    build: ./master
    container_name: clock-master
    environment:
      PORT: "5000"
      MASTER_OFFSET: "0"
      MASTER_DELAY_MS: "${MASTER_DELAY_MS:-0}"
      DELAY_MODE: "${DELAY_MODE:-symmetric}"
    networks:
      - clock-net

  client1:
    <<: *client-base
    container_name: clock-client1
    environment:
      <<: *client-env
      CLIENT_ID: client1
      CLOCK_OFFSET: "-8"

  client2:
    <<: *client-base
    container_name: clock-client2
    environment:
      <<: *client-env
      CLIENT_ID: client2
      CLOCK_OFFSET: "+6"

  client3:
    <<: *client-base
    container_name: clock-client3
    environment:
      <<: *client-env
      CLIENT_ID: client3
      CLOCK_OFFSET: "-4"

  client4:
    <<: *client-base
    container_name: clock-client4
    environment:
      <<: *client-env
      CLIENT_ID: client4
      CLOCK_OFFSET: "+10"

networks:
  clock-net:
    external: true   # created by: docker network create clock-net
