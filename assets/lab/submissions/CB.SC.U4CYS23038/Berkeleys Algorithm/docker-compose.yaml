services:

  server:
    build: ./server
    container_name: clock-server

    environment:
      CLOCK_OFFSET: "0"

    ports:
      - "5000:5000"

    networks:
      - clock-network


  client1:
    build: ./client
    container_name: clock-client1

    environment:
      SERVER_HOST: server
      CLOCK_OFFSET: "-8"

    depends_on:
      - server

    networks:
      - clock-network


  client2:
    build: ./client
    container_name: clock-client2

    environment:
      SERVER_HOST: server
      CLOCK_OFFSET: "6"

    depends_on:
      - server

    networks:
      - clock-network

  client3:
    build: ./client
    container_name: clock-client3

    environment:
      SERVER_HOST: server
      CLOCK_OFFSET: "-4"

    depends_on:
      - server

    networks:
      - clock-network

  client4:
    build: ./client
    container_name: clock-client4

    environment:
      SERVER_HOST: server
      CLOCK_OFFSET: "10"

    depends_on:
      - server

    networks:
      - clock-network

networks:
  clock-network:
    driver: bridge
