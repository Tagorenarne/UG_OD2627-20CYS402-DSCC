services:
  clock-master:
    build: ./master
    container_name: clock-master
    environment:
      - CLOCK_OFFSET=0
      - CLIENTS=clock-client1:8080,clock-client2:8080,clock-client3:8080,clock-client4:8080
      - THRESHOLD=0          # 0 = no outlier removal; e.g. 60 = ignore nodes off by > 60 sec
    depends_on: [clock-client1, clock-client2, clock-client3, clock-client4]
    networks: [clock-net]

  clock-client1:
    build: ./client
    container_name: clock-client1
    environment: [CLIENT_ID=client1, CLOCK_OFFSET=-8]
    networks: [clock-net]

  clock-client2:
    build: ./client
    container_name: clock-client2
    environment: [CLIENT_ID=client2, CLOCK_OFFSET=6]
    networks: [clock-net]

  clock-client3:
    build: ./client
    container_name: clock-client3
    environment: [CLIENT_ID=client3, CLOCK_OFFSET=-4]
    networks: [clock-net]

  clock-client4:
    build: ./client
    container_name: clock-client4
    environment: [CLIENT_ID=client4, CLOCK_OFFSET=10]
    networks: [clock-net]

networks:
  clock-net:
    name: clock-net
    external: true