services:
  time-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cristian-time-server
    ports:
      - "8888:8888"
    networks:
      - sync-net
    restart: unless-stopped

  time-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cristian-time-client
    depends_on:
      - time-server
    environment:
      - SERVER_HOST=time-server
      - SERVER_PORT=8888
      - SIMULATED_DRIFT=12.345678
      - ROUNDS=5
      - INTERVAL=2.0
    networks:
      - sync-net

networks:
  sync-net:
    driver: bridge
