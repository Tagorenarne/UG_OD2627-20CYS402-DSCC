services:
  webapp:
    build: .
    ports:
      - "8080:8080"
    networks:
      - portal_net

  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: portal
    networks:
      - portal_net
    volumes:
      - db_data:/var/lib/postgresql/data

networks:
  portal_net:
    driver: bridge

volumes:
  db_data:
