services:

  master:
    build:
      context: ./master
    image: cs_ba_master
    container_name: berkeley-master
    environment:
      CLOCK_OFFSET: "0"
    networks:
      - berkeley-net

  client1:
    build:
      context: ./client
    image: cs_ba_follower
    container_name: berkeley-client1
    environment:
      CLIENT_ID: "Client-1"
      CLOCK_OFFSET: "-8"
    networks:
      - berkeley-net

  client2:
    build:
      context: ./client
    image: cs_ba_follower
    container_name: berkeley-client2
    environment:
      CLIENT_ID: "Client-2"
      CLOCK_OFFSET: "6"
    networks:
      - berkeley-net

  client3:
    build:
      context: ./client
    image: cs_ba_follower
    container_name: berkeley-client3
    environment:
      CLIENT_ID: "Client-3"
      CLOCK_OFFSET: "-4"
    networks:
      - berkeley-net

  client4:
    build:
      context: ./client
    image: cs_ba_follower
    container_name: berkeley-client4
    environment:
      CLIENT_ID: "Client-4"
      CLOCK_OFFSET: "10"
    networks:
      - berkeley-net

networks:
  berkeley-net:
    driver: bridge
