services:

  clock-master:
    build:
      context: ./master
      dockerfile: Dockerfile
    container_name: clock-master
    environment:
      CLOCK_OFFSET: "0"
      MASTER_DELAY: "0"
    networks:
      - clock-net

  clock-client1:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: clock-client1
    environment:
      SERVER_HOST: "clock-master"
      CLIENT_ID: "Client-1"
      CLOCK_OFFSET: "-8"
    depends_on:
      - clock-master
    networks:
      - clock-net

  clock-client2:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: clock-client2
    environment:
      SERVER_HOST: "clock-master"
      CLIENT_ID: "Client-2"
      CLOCK_OFFSET: "6"
    depends_on:
      - clock-master
    networks:
      - clock-net

  clock-client3:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: clock-client3
    environment:
      SERVER_HOST: "clock-master"
      CLIENT_ID: "Client-3"
      CLOCK_OFFSET: "-4"
    depends_on:
      - clock-master
    networks:
      - clock-net

  clock-client4:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: clock-client4
    environment:
      SERVER_HOST: "clock-master"
      CLIENT_ID: "Client-4"
      CLOCK_OFFSET: "10"
    depends_on:
      - clock-master
    networks:
      - clock-net

networks:

  clock-net:
    name: clock-net
    driver: bridge
