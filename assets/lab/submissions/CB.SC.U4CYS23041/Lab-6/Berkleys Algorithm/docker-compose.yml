# =============================================================================
# Berkeley Clock Synchronization  -  20CYS402 Lab #6B
#
#   master (coordinator)  +  4 clients, joined by a dedicated `clock-net`
#
#   Build & run:   docker compose up --build
#   Tear down:     docker compose down -v
#
# Every clock offset is configurable through an environment variable.
# See experiments/ for the three hand-out experiments and the faulty-node run.
# =============================================================================

name: berkeley-clock

services:
  # ---------------------------------------------------------------------------
  # Master / Coordinator
  # ---------------------------------------------------------------------------
  clock-master:
    build:
      context: ./cs_ba_leader
      dockerfile: Dockerfile
    image: santhoshtharun7/cs_ba_leader:latest
    container_name: clock-master
    hostname: master
    environment:
      NODE_ID: "master"
      CLOCK_OFFSET: "0"          # the coordinator also has a clock
      CLOCK_BASE: "12:00:00"
      CLOCK_MODE: "frozen"       # all clocks tick in lock-step, fixed offsets
      CLOCK_TICK: "${CLOCK_TICK:-0}"  # 0 = frozen at 12:00:00; >0 = clocks tick
      CLIENTS: "client1,client2,client3,client4"
      CLIENT_PORT: "5000"
      POLL_MODE: "parallel"       # poll every node in one concurrent round
      RTT_COMPENSATION: "1"      # back out half the round-trip delay
      POLL_TIMEOUT: "5"
      ROUNDS: "1"                 # increase to keep re-synchronising
      ROUND_INTERVAL: "15"
      PRE_SYNC_DELAY: "3"         # let the followers finish booting
      # Outlier handling is OFF by default (classic Berkeley).
      # Set OUTLIER_THRESHOLD=60 to switch it on - see Part K of the hand-out.
      OUTLIER_THRESHOLD: "${OUTLIER_THRESHOLD:-0}"
      OUTLIER_ACTION: "${OUTLIER_ACTION:-skip}"
      KEEP_ALIVE: "${KEEP_ALIVE:-0}"
    networks:
      clock-net:
        aliases: [master]
    depends_on:
      clock-client1:
        condition: service_healthy
      clock-client2:
        condition: service_healthy
      clock-client3:
        condition: service_healthy
      clock-client4:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Client 1
  # ---------------------------------------------------------------------------
  clock-client1:
    build:
      context: ./cs_ba_follower
      dockerfile: Dockerfile
    image: santhoshtharun7/cs_ba_follower:latest
    container_name: clock-client1
    hostname: client1
    environment:
      CLIENT_ID: "client1"
      CLOCK_MODE: "frozen"
      CLOCK_TICK: "${CLOCK_TICK:-0}"
      CLOCK_OFFSET: "${CLIENT1_OFFSET:--8}"   # default -8 sec  (11:59:52)
      CLOCK_BASE: "12:00:00"
      PORT: "5000"
    networks:
      - clock-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Client 2
  # ---------------------------------------------------------------------------
  clock-client2:
    build:
      context: ./cs_ba_follower
      dockerfile: Dockerfile
    image: santhoshtharun7/cs_ba_follower:latest
    container_name: clock-client2
    hostname: client2
    environment:
      CLIENT_ID: "client2"
      CLOCK_MODE: "frozen"
      CLOCK_TICK: "${CLOCK_TICK:-0}"
      CLOCK_OFFSET: "${CLIENT2_OFFSET:-6}"    # default +6 sec  (12:00:06)
      CLOCK_BASE: "12:00:00"
      PORT: "5000"
    networks:
      - clock-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Client 3
  # ---------------------------------------------------------------------------
  clock-client3:
    build:
      context: ./cs_ba_follower
      dockerfile: Dockerfile
    image: santhoshtharun7/cs_ba_follower:latest
    container_name: clock-client3
    hostname: client3
    environment:
      CLIENT_ID: "client3"
      CLOCK_MODE: "frozen"
      CLOCK_TICK: "${CLOCK_TICK:-0}"
      CLOCK_OFFSET: "${CLIENT3_OFFSET:--4}"   # default -4 sec  (11:59:56)
      CLOCK_BASE: "12:00:00"
      PORT: "5000"
    networks:
      - clock-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Client 4
  # ---------------------------------------------------------------------------
  clock-client4:
    build:
      context: ./cs_ba_follower
      dockerfile: Dockerfile
    image: santhoshtharun7/cs_ba_follower:latest
    container_name: clock-client4
    hostname: client4
    environment:
      CLIENT_ID: "client4"
      CLOCK_MODE: "frozen"
      CLOCK_TICK: "${CLOCK_TICK:-0}"
      CLOCK_OFFSET: "${CLIENT4_OFFSET:-10}"   # default +10 sec (12:00:10)
      CLOCK_BASE: "12:00:00"
      PORT: "5000"
    networks:
      - clock-net
    restart: unless-stopped

# -----------------------------------------------------------------------------
# Dedicated Docker network for the experiment
# -----------------------------------------------------------------------------
networks:
  clock-net:
    name: clock-net
    driver: bridge
