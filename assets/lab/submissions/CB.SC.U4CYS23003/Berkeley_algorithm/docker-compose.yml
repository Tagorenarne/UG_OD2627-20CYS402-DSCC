services:

  leader:
    build: ./leader
    container_name: berkeley-leader
    ports:
      - "5000:5000"
    networks:
      - berkeley-net
    depends_on:
      - follower1
      - follower2
      - follower3

  follower1:
    build: ./follower
    container_name: follower1
    environment:
      - PORT=5001
      - CLOCK_OFFSET=2
    networks:
      - berkeley-net

  follower2:
    build: ./follower
    container_name: follower2
    environment:
      - PORT=5002
      - CLOCK_OFFSET=-3
    networks:
      - berkeley-net

  follower3:
    build: ./follower
    container_name: follower3
    environment:
      - PORT=5003
      - CLOCK_OFFSET=5
    networks:
      - berkeley-net


networks:

  berkeley-net:
    driver: bridge