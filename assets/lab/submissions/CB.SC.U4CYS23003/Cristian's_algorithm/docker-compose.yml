services:
  master:
    image: andocs/cs_ca_leader:latest
    environment:
      - PYTHONUNBUFFERED=1
      - MASTER_DELAY=0.1

  follower_1:
    image: andocs/cs_ca_follower:latest
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=master
      - CLIENT_ID=client_1
      - CLOCK_OFFSET=-5.0

  follower_2:
    image: andocs/cs_ca_follower:latest
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=master
      - CLIENT_ID=client_2
      - CLOCK_OFFSET=10.0

  follower_3:
    image: andocs/cs_ca_follower:latest
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=master
      - CLIENT_ID=client_3
      - CLOCK_OFFSET=-15.5

  follower_4:
    image: andocs/cs_ca_follower:latest
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=master
      - CLIENT_ID=client_4
      - CLOCK_OFFSET=3.25