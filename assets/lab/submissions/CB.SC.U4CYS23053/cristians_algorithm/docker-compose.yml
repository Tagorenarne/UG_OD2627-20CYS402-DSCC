services:

  clock-master:
    build: ./master
    container_name: clock-master
    environment:
      MASTER_DELAY: "0"
    networks:
      - clock-net

  clock-client1:
    build: ./client
    container_name: clock-client1
    environment:
      CLIENT_ID: "client1"
      CLOCK_OFFSET: "-8"
    depends_on:
      - clock-master
    networks:
      - clock-net

  clock-client2:
    build: ./client
    container_name: clock-client2
    environment:
      CLIENT_ID: "client2"
      CLOCK_OFFSET: "6"
    depends_on:
      - clock-master
    networks:
      - clock-net

  clock-client3:
    build: ./client
    container_name: clock-client3
    environment:
      CLIENT_ID: "client3"
      CLOCK_OFFSET: "-4"
    depends_on:
      - clock-master
    networks:
      - clock-net

  clock-client4:
    build: ./client
    container_name: clock-client4
    environment:
      CLIENT_ID: "client4"
      CLOCK_OFFSET: "10"
    depends_on:
      - clock-master
    networks:
      - clock-net

networks:
  clock-net:
    name: clock-net
    