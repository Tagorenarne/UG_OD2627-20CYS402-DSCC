name: dscc34-simple-cristian

services:
  server:
    build: ./server
    environment:
      CLOCK_OFFSET: "0"
      RESPONSE_DELAY: "${RESPONSE_DELAY:-0}"
    networks: [clock-net]

  client1:
    build: ./client
    environment:
      CLIENT_ID: Client-1
      SERVER_HOST: server
      CLOCK_OFFSET: "${CLIENT1_OFFSET:--8}"
    depends_on: [server]
    networks: [clock-net]

  client2:
    build: ./client
    environment:
      CLIENT_ID: Client-2
      SERVER_HOST: server
      CLOCK_OFFSET: "${CLIENT2_OFFSET:-6}"
    depends_on: [server]
    networks: [clock-net]

  client3:
    build: ./client
    environment:
      CLIENT_ID: Client-3
      SERVER_HOST: server
      CLOCK_OFFSET: "${CLIENT3_OFFSET:--4}"
    depends_on: [server]
    networks: [clock-net]

  client4:
    build: ./client
    environment:
      CLIENT_ID: Client-4
      SERVER_HOST: server
      CLOCK_OFFSET: "${CLIENT4_OFFSET:-10}"
    depends_on: [server]
    networks: [clock-net]

networks:
  clock-net:
    driver: bridge
