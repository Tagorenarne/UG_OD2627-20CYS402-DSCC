services:

  master:
    image: phantomone/cs_ca_leader:latest

    container_name: clock-master

    environment:
      MASTER_ID: master
      MASTER_PORT: 5000
      NETWORK_DELAY: ${NETWORK_DELAY:-0}

    ports:
      - "5000:5000"

    networks:
      - clock-net


  client1:
    image: phantomone/cs_ca_follower:latest

    container_name: clock-client1

    environment:
      CLIENT_ID: client1
      CLOCK_OFFSET: -8
      MASTER_HOST: master
      MASTER_PORT: 5000

    depends_on:
      - master

    networks:
      - clock-net


  client2:
    image: phantomone/cs_ca_follower:latest

    container_name: clock-client2

    environment:
      CLIENT_ID: client2
      CLOCK_OFFSET: 6
      MASTER_HOST: master
      MASTER_PORT: 5000

    depends_on:
      - master

    networks:
      - clock-net


  client3:
    image: phantomone/cs_ca_follower:latest

    container_name: clock-client3

    environment:
      CLIENT_ID: client3
      CLOCK_OFFSET: -4
      MASTER_HOST: master
      MASTER_PORT: 5000

    depends_on:
      - master

    networks:
      - clock-net


  client4:
    image: phantomone/cs_ca_follower:latest

    container_name: clock-client4

    environment:
      CLIENT_ID: client4
      CLOCK_OFFSET: 10
      MASTER_HOST: master
      MASTER_PORT: 5000

    depends_on:
      - master

    networks:
      - clock-net


networks:

  clock-net:
    name: clock-net
    driver: bridge
