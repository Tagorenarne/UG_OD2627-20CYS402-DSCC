services:

  leader:
    build:
      context: ./master
    container_name: cs_ba_leader
    image: cs_ba_leader
    environment:
      MASTER_PORT: 5000
      CLOCK_OFFSET: 0
      CLIENTS: follower1,follower2,follower3,follower4
    networks:
      - clock-net
    ports:
      - "5000:5000"

  follower1:
    build:
      context: ./client
    container_name: cs_ba_follower1
    image: cs_ba_follower
    environment:
      CLIENT_ID: follower1
      CLOCK_OFFSET: -5
      CLIENT_PORT: 5001
    networks:
      - clock-net

  follower2:
    build:
      context: ./client
    container_name: cs_ba_follower2
    image: cs_ba_follower
    environment:
      CLIENT_ID: follower2
      CLOCK_OFFSET: 5
      CLIENT_PORT: 5001
    networks:
      - clock-net

  follower3:
    build:
      context: ./client
    container_name: cs_ba_follower3
    image: cs_ba_follower
    environment:
      CLIENT_ID: follower3
      CLOCK_OFFSET: 3
      CLIENT_PORT: 5001
    networks:
      - clock-net

  follower4:
    build:
      context: ./client
    container_name: cs_ba_follower4
    image: cs_ba_follower
    environment:
      CLIENT_ID: follower4
      CLOCK_OFFSET: 3
      CLIENT_PORT: 5001
    networks:
      - clock-net

networks:
  clock-net:
    driver: bridge
