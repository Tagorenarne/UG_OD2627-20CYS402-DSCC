version: "3.9"

services:
  clock-master:
    build: ./master
    container_name: clock-master
    environment:
      - PORT=5000
      # Change this between experiment runs to simulate different network/
      # processing delays (Part J): 0, 0.1, 0.2, 0.5
      # Can be overridden from the shell: ARTIFICIAL_DELAY=0.2 docker compose up --build
      - ARTIFICIAL_DELAY=${ARTIFICIAL_DELAY:-0}
    ports:
      - "5000:5000"
    networks:
      - clock-net

  clock-client1:
    build: ./client
    container_name: clock-client1
    depends_on:
      - clock-master
    environment:
      - CLIENT_ID=Client-1
      - CLOCK_OFFSET=-8
      - MASTER_HOST=clock-master
      - MASTER_PORT=5000
      - SYNC_INTERVAL=10
      - SYNC_COUNT=0
    networks:
      - clock-net

  clock-client2:
    build: ./client
    container_name: clock-client2
    depends_on:
      - clock-master
    environment:
      - CLIENT_ID=Client-2
      - CLOCK_OFFSET=6
      - MASTER_HOST=clock-master
      - MASTER_PORT=5000
      - SYNC_INTERVAL=10
      - SYNC_COUNT=0
    networks:
      - clock-net

  clock-client3:
    build: ./client
    container_name: clock-client3
    depends_on:
      - clock-master
    environment:
      - CLIENT_ID=Client-3
      - CLOCK_OFFSET=-4
      - MASTER_HOST=clock-master
      - MASTER_PORT=5000
      - SYNC_INTERVAL=10
      - SYNC_COUNT=0
    networks:
      - clock-net

  clock-client4:
    build: ./client
    container_name: clock-client4
    depends_on:
      - clock-master
    environment:
      - CLIENT_ID=Client-4
      - CLOCK_OFFSET=10
      - MASTER_HOST=clock-master
      - MASTER_PORT=5000
      - SYNC_INTERVAL=10
      - SYNC_COUNT=0
    networks:
      - clock-net

networks:
  clock-net:
    name: clock-net
    driver: bridge
