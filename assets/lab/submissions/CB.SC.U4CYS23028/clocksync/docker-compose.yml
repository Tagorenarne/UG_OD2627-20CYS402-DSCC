services:

  clock-master:
    build:
      context: ./master
    container_name: clock-master
    ports:
      - "5000:5000"
    environment:
      - ARTIFICIAL_DELAY=0
    networks:
      - clock-net

  clock-client1:
    build:
      context: ./client
    container_name: clock-client1
    depends_on:
      - clock-master
    environment:
      - CLIENT_ID=Client-1
      - CLOCK_OFFSET=-8
      - MASTER_HOST=clock-master
      - MASTER_PORT=5000
      - SYNC_ROUNDS=1
      - SYNC_INTERVAL=5
    networks:
      - clock-net

  clock-client2:
    build:
      context: ./client
    container_name: clock-client2
    depends_on:
      - clock-master
    environment:
      - CLIENT_ID=Client-2
      - CLOCK_OFFSET=6
      - MASTER_HOST=clock-master
      - MASTER_PORT=5000
      - SYNC_ROUNDS=1
      - SYNC_INTERVAL=5
    networks:
      - clock-net

  clock-client3:
    build:
      context: ./client
    container_name: clock-client3
    depends_on:
      - clock-master
    environment:
      - CLIENT_ID=Client-3
      - CLOCK_OFFSET=-4
      - MASTER_HOST=clock-master
      - MASTER_PORT=5000
      - SYNC_ROUNDS=1
      - SYNC_INTERVAL=5
    networks:
      - clock-net

  clock-client4:
    build:
      context: ./client
    container_name: clock-client4
    depends_on:
      - clock-master
    environment:
      - CLIENT_ID=Client-4
      - CLOCK_OFFSET=10
      - MASTER_HOST=clock-master
      - MASTER_PORT=5000
      - SYNC_ROUNDS=1
      - SYNC_INTERVAL=5
    networks:
      - clock-net

networks:
  clock-net:
    driver: bridge