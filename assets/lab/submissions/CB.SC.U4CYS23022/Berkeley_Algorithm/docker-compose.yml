services:
  master:
    build: ./master
    container_name: clock-master
    environment:
      - CLOCK_OFFSET=0
      - CLIENTS=clock-client1,clock-client2,clock-client3,clock-client4
      - OUTLIER_THRESHOLD=0     # 0 = off; e.g. 60 to exclude the faulty node
    depends_on:
      - client1
      - client2
      - client3
      - client4
    networks:
      - clock-net

  client1:
    build: ./client
    container_name: clock-client1
    environment:
      - CLIENT_ID=client1
      - CLOCK_OFFSET=-8
    networks:
      - clock-net

  client2:
    build: ./client
    container_name: clock-client2
    environment:
      - CLIENT_ID=client2
      - CLOCK_OFFSET=6
    networks:
      - clock-net

  client3:
    build: ./client
    container_name: clock-client3
    environment:
      - CLIENT_ID=client3
      - CLOCK_OFFSET=-4
    networks:
      - clock-net

  client4:
    build: ./client
    container_name: clock-client4
    environment:
      - CLIENT_ID=client4
      - CLOCK_OFFSET=10         # faulty node experiment: 12600 (3.5 hours ahead)
    networks:
      - clock-net

networks:
  clock-net:
    external: true
