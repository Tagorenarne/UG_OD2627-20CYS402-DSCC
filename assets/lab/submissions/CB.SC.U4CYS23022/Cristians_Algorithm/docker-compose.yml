services:
  master:
    build: ./master
    container_name: clock-master
    environment:
      - CLOCK_OFFSET=0
      - DELAY_MS=0          # change to 100, 200, 500 for the delay experiments
    networks:
      - clock-net

  client1:
    build: ./client
    container_name: clock-client1
    environment:
      - CLIENT_ID=client1
      - CLOCK_OFFSET=-8
    depends_on:
      - master
    networks:
      - clock-net

  client2:
    build: ./client
    container_name: clock-client2
    environment:
      - CLIENT_ID=client2
      - CLOCK_OFFSET=6
    depends_on:
      - master
    networks:
      - clock-net

  client3:
    build: ./client
    container_name: clock-client3
    environment:
      - CLIENT_ID=client3
      - CLOCK_OFFSET=-4
    depends_on:
      - master
    networks:
      - clock-net

  client4:
    build: ./client
    container_name: clock-client4
    environment:
      - CLIENT_ID=client4
      - CLOCK_OFFSET=10
    depends_on:
      - master
    networks:
      - clock-net

networks:
  clock-net:
    external: true
