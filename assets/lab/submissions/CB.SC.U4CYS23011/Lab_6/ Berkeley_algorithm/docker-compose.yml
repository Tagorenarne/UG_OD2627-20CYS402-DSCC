services:

  master:
    build: ./master
    container_name: clock-master
    environment:
      CLOCK_OFFSET: "0"
    ports:
      - "5000:5000"
    networks:
      - clock-net

  client1:
    build: ./client
    container_name: clock-client1
    environment:
      SERVER_HOST: master
      CLOCK_OFFSET: "-8"
    depends_on:
      - master
    networks:
      - clock-net

  client2:
    build: ./client
    container_name: clock-client2
    environment:
      SERVER_HOST: master
      CLOCK_OFFSET: "6"
    depends_on:
      - master
    networks:
      - clock-net

  client3:
    build: ./client
    container_name: clock-client3
    environment:
      SERVER_HOST: master
      CLOCK_OFFSET: "-4"
    depends_on:
      - master
    networks:
      - clock-net

  client4:
    build: ./client
    container_name: clock-client4
    environment:
      SERVER_HOST: master
      CLOCK_OFFSET: "10"
    depends_on:
      - master
    networks:
      - clock-net

networks:
  clock-net:
    driver: bridge
