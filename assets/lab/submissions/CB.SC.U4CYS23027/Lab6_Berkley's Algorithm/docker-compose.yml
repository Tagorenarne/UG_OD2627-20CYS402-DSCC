services:
  clock-master:
    build: ./master
    container_name: clock-master
    environment:
      - CLOCK_OFFSET=0
      - CLIENTS=clock-client1:6000,clock-client2:6000,clock-client3:6000,clock-client4:6000
      - POLL_DELAY=3
      - OUTLIER_FILTER=false
      - OUTLIER_THRESHOLD=15
    depends_on:
      - clock-client1
      - clock-client2
      - clock-client3
      - clock-client4
    networks:
      - clock-net

  clock-client1:
    build: ./client
    container_name: clock-client1
    environment:
      - CLIENT_ID=Client 1
      - CLOCK_OFFSET=-8
      - PORT=6000
    networks:
      - clock-net

  clock-client2:
    build: ./client
    container_name: clock-client2
    environment:
      - CLIENT_ID=Client 2
      - CLOCK_OFFSET=6
      - PORT=6000
    networks:
      - clock-net

  clock-client3:
    build: ./client
    container_name: clock-client3
    environment:
      - CLIENT_ID=Client 3
      - CLOCK_OFFSET=-4
      - PORT=6000
    networks:
      - clock-net

  clock-client4:
    build: ./client
    container_name: clock-client4
    environment:
      - CLIENT_ID=Client 4
      - CLOCK_OFFSET=10
      - PORT=6000
    networks:
      - clock-net

networks:
  clock-net:
    name: clock-net
    driver: bridge
