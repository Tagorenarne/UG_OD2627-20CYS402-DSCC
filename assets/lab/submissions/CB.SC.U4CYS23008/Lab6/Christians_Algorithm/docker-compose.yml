services:

  # ==========================================
  # LEADER / TIME SERVER
  # ==========================================

  clock-master:
    image: cs_ca_leader
    container_name: clock-master

    environment:
      - DELAY_MS=0

    ports:
      - "5000:5000"

    networks:
      - clock-net


  # ==========================================
  # FOLLOWER 1
  # ==========================================

  clock-client1:
    image: cs_ca_follower
    container_name: clock-client1

    environment:
      - CLIENT_ID=Follower-1
      - CLOCK_OFFSET=-8
      - MASTER_HOST=clock-master

    depends_on:
      - clock-master

    networks:
      - clock-net


  # ==========================================
  # FOLLOWER 2
  # ==========================================

  clock-client2:
    image: cs_ca_follower
    container_name: clock-client2

    environment:
      - CLIENT_ID=Follower-2
      - CLOCK_OFFSET=6
      - MASTER_HOST=clock-master

    depends_on:
      - clock-master

    networks:
      - clock-net


  # ==========================================
  # FOLLOWER 3
  # ==========================================

  clock-client3:
    image: cs_ca_follower
    container_name: clock-client3

    environment:
      - CLIENT_ID=Follower-3
      - CLOCK_OFFSET=-4
      - MASTER_HOST=clock-master

    depends_on:
      - clock-master

    networks:
      - clock-net


  # ==========================================
  # FOLLOWER 4
  # ==========================================

  clock-client4:
    image: cs_ca_follower
    container_name: clock-client4

    environment:
      - CLIENT_ID=Follower-4
      - CLOCK_OFFSET=10
      - MASTER_HOST=clock-master

    depends_on:
      - clock-master

    networks:
      - clock-net


# ==========================================
# DOCKER NETWORK
# ==========================================

networks:

  clock-net:
    name: clock-net
    driver: bridge