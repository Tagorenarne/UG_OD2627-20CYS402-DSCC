services:
  master:
    image: cs_ba_leader
    build: ./master
    container_name: clock-master
    environment:
      CLOCK_OFFSET: "0"
      MASTER_PORT: "5000"
      CLIENT_TIMEOUT: "5"
      EXCLUDE_OUTLIERS: "false"
      OUTLIER_THRESHOLD: "60"
    networks:
      - clock-net
    restart: unless-stopped

  client1:
    image: cs_ba_follower
    build: ./client
    container_name: clock-client1
    environment:
      CLIENT_ID: client1
      CLOCK_OFFSET: "-8"
      MASTER_HOST: master
      MASTER_PORT: "5000"
    depends_on:
      - master
    networks:
      - clock-net
    restart: unless-stopped

  client2:
    image: cs_ba_follower
    build: ./client
    container_name: clock-client2
    environment:
      CLIENT_ID: client2
      CLOCK_OFFSET: "6"
      MASTER_HOST: master
      MASTER_PORT: "5000"
    depends_on:
      - master
    networks:
      - clock-net
    restart: unless-stopped

  client3:
    image: cs_ba_follower
    build: ./client
    container_name: clock-client3
    environment:
      CLIENT_ID: client3
      CLOCK_OFFSET: "-4"
      MASTER_HOST: master
      MASTER_PORT: "5000"
    depends_on:
      - master
    networks:
      - clock-net
    restart: unless-stopped

  client4:
    image: cs_ba_follower
    build: ./client
    container_name: clock-client4
    environment:
      CLIENT_ID: client4
      CLOCK_OFFSET: "10"
      MASTER_HOST: master
      MASTER_PORT: "5000"
    depends_on:
      - master
    networks:
      - clock-net
    restart: unless-stopped

networks:
  clock-net:
    name: clock-net
    driver: bridge