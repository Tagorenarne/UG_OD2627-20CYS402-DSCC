# 1) docker network create clock-net
# 2) docker compose up --build --abort-on-container-exit
# Offsets are overridable from the shell, e.g.  C1_OFFSET=-5 C2_OFFSET=5 docker compose up --build
services:
  clock-client1:
    build: ./client
    container_name: clock-client1
    environment: [ "CLIENT_ID=client1", "CLOCK_OFFSET=${C1_OFFSET:--8}" ]
    networks: [clock-net]
  clock-client2:
    build: ./client
    container_name: clock-client2
    environment: [ "CLIENT_ID=client2", "CLOCK_OFFSET=${C2_OFFSET:-6}" ]
    networks: [clock-net]
  clock-client3:
    build: ./client
    container_name: clock-client3
    environment: [ "CLIENT_ID=client3", "CLOCK_OFFSET=${C3_OFFSET:--4}" ]
    networks: [clock-net]
  clock-client4:
    build: ./client
    container_name: clock-client4
    environment: [ "CLIENT_ID=client4", "CLOCK_OFFSET=${C4_OFFSET:-10}" ]
    networks: [clock-net]
  clock-master:
    build: ./master
    container_name: clock-master
    depends_on: [clock-client1, clock-client2, clock-client3, clock-client4]
    environment:
      - CLIENTS=clock-client1:5000,clock-client2:5000,clock-client3:5000,clock-client4:5000
      - MASTER_OFFSET=0
      - OUTLIER_THRESHOLD=${OUTLIER_THRESHOLD:-0}
      - EXPERIMENT_ID=${EXPERIMENT_ID:-1}
    networks: [clock-net]

networks:
  clock-net:
    external: true
