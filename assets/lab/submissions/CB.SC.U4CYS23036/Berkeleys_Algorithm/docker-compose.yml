name: dscc-23036-berkeley

x-client: &client
  build: ./client
  image: dscc-23036-berkeley-client
  networks: [clock-net]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)"]
    interval: 1s
    timeout: 3s
    retries: 20

services:
  master:
    build: ./master
    networks: [clock-net]
    environment:
      CLOCK_OFFSET: ${MASTER_OFFSET:-0}
      OUTLIER_THRESHOLD: ${OUTLIER_THRESHOLD:-}
    depends_on:
      client1:
        condition: service_healthy
      client2:
        condition: service_healthy
      client3:
        condition: service_healthy
      client4:
        condition: service_healthy

  client1:
    <<: *client
    environment:
      CLIENT_ID: client1
      CLOCK_OFFSET: ${CLIENT1_OFFSET:--8}

  client2:
    <<: *client
    environment:
      CLIENT_ID: client2
      CLOCK_OFFSET: ${CLIENT2_OFFSET:-6}

  client3:
    <<: *client
    environment:
      CLIENT_ID: client3
      CLOCK_OFFSET: ${CLIENT3_OFFSET:--4}

  client4:
    <<: *client
    environment:
      CLIENT_ID: client4
      CLOCK_OFFSET: ${CLIENT4_OFFSET:-10}

networks:
  clock-net:
    driver: bridge
