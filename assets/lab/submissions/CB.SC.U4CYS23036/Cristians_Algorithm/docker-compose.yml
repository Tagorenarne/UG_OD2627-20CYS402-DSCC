name: dscc-23036-cristian

x-client: &client
  build: ./client
  image: dscc-23036-cristian-client
  networks: [clock-net]
  depends_on:
    master:
      condition: service_healthy

services:
  master:
    build: ./master
    networks: [clock-net]
    environment:
      CLOCK_OFFSET: ${MASTER_OFFSET:-0}
      PROCESSING_DELAY_MS: ${PROCESSING_DELAY_MS:-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)"]
      interval: 1s
      timeout: 3s
      retries: 20

  client1:
    <<: *client
    environment:
      CLIENT_ID: client1
      CLOCK_OFFSET: ${CLIENT1_OFFSET:--8}
      DELAYS_MS: ${DELAYS_MS:-0,100,200,500}

  client2:
    <<: *client
    environment:
      CLIENT_ID: client2
      CLOCK_OFFSET: ${CLIENT2_OFFSET:-6}
      DELAYS_MS: ${DELAYS_MS:-0,100,200,500}

  client3:
    <<: *client
    environment:
      CLIENT_ID: client3
      CLOCK_OFFSET: ${CLIENT3_OFFSET:--4}
      DELAYS_MS: ${DELAYS_MS:-0,100,200,500}

  client4:
    <<: *client
    environment:
      CLIENT_ID: client4
      CLOCK_OFFSET: ${CLIENT4_OFFSET:-10}
      DELAYS_MS: ${DELAYS_MS:-0,100,200,500}

networks:
  clock-net:
    driver: bridge
